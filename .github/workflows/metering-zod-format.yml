name: Review Zod guard formatting

on:
  push:
    branches:
      - feat/arl-metering-receipt-spec
    paths:
      - ".github/workflows/metering-zod-format.yml"
      - "scripts/check-zod.mjs"
      - ".audit-allowlist.json"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Output exact Prettier formatting for security guard
        run: |
          ./node_modules/.bin/prettier --write scripts/check-zod.mjs .audit-allowlist.json >/dev/null
          for file in scripts/check-zod.mjs .audit-allowlist.json; do
            printf 'METERING_ZOD_FORMAT:%s:' "$file"
            base64 -w 0 "$file"
            printf '\n'
          done
