name: Metering acceptance

on:
  push:
    branches:
      - feat/arl-metering-receipt-spec
      - feat/arl-metering-runner-verifier
      - feat/arl-metering-vote-demo
    paths:
      - ".github/workflows/metering-acceptance.yml"
      - "packages/verifier/**"
      - "spec/arl-metering-receipt/**"
      - "scripts/demo-resource-metering.sh"
      - "docs/verifiable-resource-metering.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: TypeScript, lint, format and verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Formatting
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Signed receipt and replay unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test -w @arl/verifier

      - name: Export exact formatting candidates for review
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          files=(
            docs/open-source.md
            docs/verifiable-resource-metering.md
            packages/verifier/src/metering/artifact.ts
            packages/verifier/src/metering/provider.ts
            packages/verifier/src/metering/receipt.ts
            packages/verifier/src/metering/registration.ts
            packages/verifier/src/metering/runner.ts
            packages/verifier/src/metering/vote.ts
            packages/verifier/test-anvil/metering.anvil.test.ts
            packages/verifier/test-docker/metering.test.ts
            packages/verifier/test/meteringArtifact.test.ts
            packages/verifier/test/meteringCgroup.test.ts
            packages/verifier/test/meteringEvidence.test.ts
            packages/verifier/test/meteringProducer.test.ts
            packages/verifier/test/meteringReceipt.test.ts
            packages/verifier/test/meteringRegistration.test.ts
            packages/verifier/test/meteringReplay.test.ts
            packages/verifier/test/meteringVectors.test.ts
          )
          ./node_modules/.bin/prettier --write "${files[@]}" >/dev/null
          while IFS= read -r changed; do
            printf 'METERING_FORMATTED:%s:' "$changed"
            base64 -w 0 "$changed"
            printf '\n'
          done < <(git diff --name-only -- "${files[@]}")

  anvil:
    name: Local ERC-8004 meter registration and composite vote
    if: github.ref_name == 'feat/arl-metering-vote-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.3
      - run: npm ci
      - name: Build existing contracts (no Solidity modifications)
        working-directory: contracts
        run: forge build --skip test --skip script
      - name: Check local composite vote and settlement
        run: node --test packages/verifier/test-anvil/metering.anvil.test.ts

# Real Linux cgroup v2 + Docker cgroupfs tests are deliberately not silently
# treated as passing: they require an operator-provisioned delegated cgroup.
