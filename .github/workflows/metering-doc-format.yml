name: Metering runner document formatting

on:
  push:
    branches:
      - feat/arl-metering-runner-verifier
    paths:
      - .github/workflows/metering-doc-format.yml
      - docs/verifiable-resource-metering.md

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Export canonical formatting without writing to Git
        run: |
          ./node_modules/.bin/prettier --write docs/verifiable-resource-metering.md >/dev/null
          printf 'METERING_RUNNER_DOC:'
          base64 -w 0 docs/verifiable-resource-metering.md
          printf '\n'
